<script>
/* ============================================================== utilities */

var U = (function () {

  /** Deterministic PRNG. Both clients in a round run the same seed, which is
   *  how the piece order stays identical without ever being transmitted. */
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function $(sel, root) { return (root || document).querySelector(sel); }
  function $$(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }

  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      if (k === 'class') node.className = attrs[k];
      else if (k === 'text') node.textContent = attrs[k];
      else if (k === 'html') node.innerHTML = attrs[k];
      else if (k === 'style') node.setAttribute('style', attrs[k]);
      else if (k.indexOf('on') === 0) node.addEventListener(k.slice(2).toLowerCase(), attrs[k]);
      else node.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function (c) {
      node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    });
    return node;
  }

  function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }

  function escapeHtml(s) {
    return String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  /* ------------------------------------------------------------ formatting */

  function fmtTime(ms) {
    if (!ms && ms !== 0) return '—';
    var total = Math.max(0, ms);
    var m = Math.floor(total / 60000);
    var s = Math.floor((total % 60000) / 1000);
    return m + ':' + String(s).padStart(2, '0');
  }

  function fmtTimeMs(ms) {
    if (!ms && ms !== 0) return '—';
    var total = Math.max(0, ms);
    var m = Math.floor(total / 60000);
    var s = Math.floor((total % 60000) / 1000);
    var cs = Math.floor((total % 1000) / 10);
    return (m > 0 ? m + ':' + String(s).padStart(2, '0') : String(s)) + '.' + String(cs).padStart(2, '0');
  }

  function fmtNum(n, digits) {
    var v = Number(n);
    if (!isFinite(v)) return '0';
    return v.toFixed(digits === undefined ? 1 : digits);
  }

  function fmtAgo(ts) {
    var diff = Date.now() - Number(ts);
    if (diff < 60000) return '방금';
    if (diff < 3600000) return Math.floor(diff / 60000) + '분 전';
    if (diff < 86400000) return Math.floor(diff / 3600000) + '시간 전';
    return Math.floor(diff / 86400000) + '일 전';
  }

  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }

  /* --------------------------------------------------------------- storage */

  var LS_PREFIX = 'tetra.gs.';
  function load(key, fallback) {
    try {
      var raw = localStorage.getItem(LS_PREFIX + key);
      return raw === null ? fallback : JSON.parse(raw);
    } catch (e) { return fallback; }
  }
  function save(key, value) {
    try { localStorage.setItem(LS_PREFIX + key, JSON.stringify(value)); } catch (e) {}
  }
  function drop(key) {
    try { localStorage.removeItem(LS_PREFIX + key); } catch (e) {}
  }

  /* ----------------------------------------------------------------- toast */

  function toast(message, kind, ms) {
    var host = $('#toast-host');
    if (!host) return;
    var node = el('div', { class: 'toast' + (kind ? ' ' + kind : ''), text: message });
    host.appendChild(node);
    setTimeout(function () {
      node.style.transition = 'opacity 0.25s, transform 0.25s';
      node.style.opacity = '0';
      node.style.transform = 'translateX(24px)';
      setTimeout(function () { if (node.parentNode) node.parentNode.removeChild(node); }, 260);
    }, ms || 3000);
  }

  /* ----------------------------------------------------------------- modal */

  function modal(contentNode) {
    var host = $('#modal-host');
    var body = $('#modal-body');
    clear(body);
    body.appendChild(contentNode);
    host.classList.add('open');
    return function close() { host.classList.remove('open'); };
  }

  function closeModal() { $('#modal-host').classList.remove('open'); }

  /* ------------------------------------------------------------ rank badge */

  function paintRankBadge(node, rankName, color) {
    if (!node) return;
    node.textContent = rankName || 'Z';
    var c = color || (window.RANK_COLORS && window.RANK_COLORS[rankName]) || '#666B7A';
    node.style.background = c;
    node.style.color = pickTextColor(c);
    node.style.boxShadow = 'inset 0 0 0 2px rgba(255,255,255,0.16), 0 0 20px -6px ' + c;
  }

  function pickTextColor(hex) {
    var h = String(hex).replace('#', '');
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    var r = parseInt(h.slice(0, 2), 16), g = parseInt(h.slice(2, 4), 16), b = parseInt(h.slice(4, 6), 16);
    var lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
    return lum > 0.62 ? '#16151d' : '#ffffff';
  }

  /* ----------------------------------------------------------------- audio */

  var audioCtx = null;
  function beep(freq, durationMs, type, gain) {
    if (!window.CONFIG || !CONFIG.sound) return;
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      var osc = audioCtx.createOscillator();
      var vol = audioCtx.createGain();
      osc.type = type || 'square';
      osc.frequency.value = freq;
      vol.gain.setValueAtTime(gain === undefined ? 0.05 : gain, audioCtx.currentTime);
      vol.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + durationMs / 1000);
      osc.connect(vol).connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + durationMs / 1000);
    } catch (e) {}
  }

  return {
    mulberry32: mulberry32,
    $: $, $$: $$, el: el, clear: clear, escapeHtml: escapeHtml,
    fmtTime: fmtTime, fmtTimeMs: fmtTimeMs, fmtNum: fmtNum, fmtAgo: fmtAgo, clamp: clamp,
    load: load, save: save, drop: drop,
    toast: toast, modal: modal, closeModal: closeModal,
    paintRankBadge: paintRankBadge, pickTextColor: pickTextColor,
    beep: beep
  };
})();
</script>

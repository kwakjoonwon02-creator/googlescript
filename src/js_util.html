<script>
/* ============================================================== utilities */

var U = (function () {

  /** Deterministic PRNG. Both clients in a round run the same seed, which is
   *  how the piece order stays identical without ever being transmitted. */
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function $(sel, root) { return (root || document).querySelector(sel); }
  function $$(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }

  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      if (k === 'class') node.className = attrs[k];
      else if (k === 'text') node.textContent = attrs[k];
      else if (k === 'html') node.innerHTML = attrs[k];
      else if (k === 'style') node.setAttribute('style', attrs[k]);
      else if (k.indexOf('on') === 0) node.addEventListener(k.slice(2).toLowerCase(), attrs[k]);
      else node.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function (c) {
      node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    });
    return node;
  }

  function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }

  function escapeHtml(s) {
    return String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  /* ------------------------------------------------------------ formatting */

  function fmtTime(ms) {
    if (!ms && ms !== 0) return '—';
    var total = Math.max(0, ms);
    var m = Math.floor(total / 60000);
    var s = Math.floor((total % 60000) / 1000);
    return m + ':' + String(s).padStart(2, '0');
  }

  function fmtTimeMs(ms) {
    if (!ms && ms !== 0) return '—';
    var total = Math.max(0, ms);
    var m = Math.floor(total / 60000);
    var s = Math.floor((total % 60000) / 1000);
    var cs = Math.floor((total % 1000) / 10);
    return (m > 0 ? m + ':' + String(s).padStart(2, '0') : String(s)) + '.' + String(cs).padStart(2, '0');
  }

  function fmtNum(n, digits) {
    var v = Number(n);
    if (!isFinite(v)) return '0';
    return v.toFixed(digits === undefined ? 1 : digits);
  }

  function fmtAgo(ts) {
    var diff = Date.now() - Number(ts);
    if (diff < 60000) return '방금';
    if (diff < 3600000) return Math.floor(diff / 60000) + '분 전';
    if (diff < 86400000) return Math.floor(diff / 3600000) + '시간 전';
    return Math.floor(diff / 86400000) + '일 전';
  }

  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }

  /* --------------------------------------------------------------- storage */

  var LS_PREFIX = 'tetra.gs.';
  function load(key, fallback) {
    try {
      var raw = localStorage.getItem(LS_PREFIX + key);
      return raw === null ? fallback : JSON.parse(raw);
    } catch (e) { return fallback; }
  }
  function save(key, value) {
    try { localStorage.setItem(LS_PREFIX + key, JSON.stringify(value)); } catch (e) {}
  }
  function drop(key) {
    try { localStorage.removeItem(LS_PREFIX + key); } catch (e) {}
  }

  /* ---------------------------------------------------------------- motion */

  var reduceMotion = (function () {
    try { return window.matchMedia('(prefers-reduced-motion: reduce)').matches; }
    catch (e) { return false; }
  })();

  /**
   * Animates a number into place. Big values matter here — a TR swing is the
   * whole point of a ranked result — and a number that lands instantly reads
   * like a static label.
   */
  function countUp(node, to, options) {
    if (!node) return;
    var opts = options || {};
    var duration = opts.ms || 900;
    var from = opts.from === undefined ? 0 : opts.from;
    var format = opts.format || function (v) { return Math.round(v).toLocaleString(); };

    if (reduceMotion || duration <= 0) { node.textContent = format(to); return; }

    var start = null;
    function step(now) {
      if (start === null) start = now;
      var t = Math.min(1, (now - start) / duration);
      // Ease out quintic: fast off the mark, long settle.
      var eased = 1 - Math.pow(1 - t, 5);
      node.textContent = format(from + (to - from) * eased);
      if (t < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  /** Restarts a CSS animation by forcing a reflow between class toggles. */
  function replay(node, className) {
    if (!node || reduceMotion) return;
    node.classList.remove(className);
    void node.offsetWidth;
    node.classList.add(className);
  }

  /* ----------------------------------------------------------------- toast */

  function toast(message, kind, ms) {
    var host = $('#toast-host');
    if (!host) return;
    var node = el('div', { class: 'toast' + (kind ? ' ' + kind : ''), text: message });
    host.appendChild(node);
    setTimeout(function () {
      node.style.transition = 'opacity 0.25s, transform 0.25s';
      node.style.opacity = '0';
      node.style.transform = 'translateX(24px)';
      setTimeout(function () { if (node.parentNode) node.parentNode.removeChild(node); }, 260);
    }, ms || 3000);
  }

  /* ----------------------------------------------------------------- modal */

  function modal(contentNode) {
    var host = $('#modal-host');
    var body = $('#modal-body');
    clear(body);
    body.appendChild(contentNode);
    host.classList.add('open');
    return function close() { host.classList.remove('open'); };
  }

  function closeModal() { $('#modal-host').classList.remove('open'); }

  /* ------------------------------------------------------------ rank badge */

  function paintRankBadge(node, rankName, color) {
    if (!node) return;
    node.textContent = rankName || 'Z';
    var c = color || (window.RANK_COLORS && window.RANK_COLORS[rankName]) || '#666B7A';
    node.style.background = c;
    node.style.color = pickTextColor(c);
    node.style.boxShadow = 'inset 0 0 0 2px rgba(255,255,255,0.16), 0 0 20px -6px ' + c;
  }

  function pickTextColor(hex) {
    var h = String(hex).replace('#', '');
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    var r = parseInt(h.slice(0, 2), 16), g = parseInt(h.slice(2, 4), 16), b = parseInt(h.slice(4, 6), 16);
    var lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
    return lum > 0.62 ? '#16151d' : '#ffffff';
  }

  /* -------------------------------------------------------------- viewport */

  /**
   * iOS does not shrink the layout viewport when the software keyboard opens.
   * It leaves the page at its full height, covers the bottom of it with the
   * keyboard, and scrolls the document to bring the focused field into view.
   * With the app pinned to inset:0 and the body unable to scroll, the rest of
   * the interface ends up behind the keyboard with no way to reach it — which
   * on an iPad means the sign-in card, the chat box or the room settings are
   * simply cut off as soon as you tap a field.
   *
   * So the app is sized from the *visual* viewport rather than the window,
   * and anything that positions itself against the bottom edge reads --kb-h.
   */
  var viewport = { height: 0, keyboard: 0 };

  function applyViewport(height, offsetTop) {
    var root = document.documentElement;
    var full = window.innerHeight || height;
    var hidden = Math.max(0, Math.round(full - height - (offsetTop || 0)));
    viewport.height = Math.round(height);
    viewport.keyboard = hidden;
    root.style.setProperty('--app-h', viewport.height + 'px');
    root.style.setProperty('--kb-h', hidden + 'px');
    // A keyboard takes a large bite; a browser toolbar sliding away does not.
    var covered = hidden > 120;
    document.body.classList.toggle('keyboard-open', covered);
    fitStage();

    // The field that raised the keyboard is the one you need to see. iOS
    // scrolls the document to reveal it before the app has been resized, and
    // syncViewport then undoes that scroll; bring it back into view inside
    // the screen, which is where it can actually be scrolled to.
    var active = document.activeElement;
    if (covered && active && /^(INPUT|TEXTAREA|SELECT)$/.test(active.tagName)) {
      try { active.scrollIntoView({ block: 'center' }); } catch (e) {}
    }
  }

  function syncViewport() {
    var vv = window.visualViewport;
    applyViewport(vv ? vv.height : window.innerHeight, vv ? vv.offsetTop : 0);
    // iOS scrolls the document to reveal the focused field. The field is
    // inside the visible box now, so there is nothing to reveal — and any
    // scroll it did leaves the page offset for good, since the body cannot
    // be scrolled back.
    if (window.scrollY || window.scrollX) window.scrollTo(0, 0);
  }

  function watchViewport() {
    var vv = window.visualViewport;
    if (vv) {
      vv.addEventListener('resize', syncViewport);
      vv.addEventListener('scroll', syncViewport);
    }
    window.addEventListener('resize', syncViewport);
    // The orientation change fires before the new size is readable.
    window.addEventListener('orientationchange', function () { setTimeout(syncViewport, 250); });
    syncViewport();
  }

  /**
   * The matrix is a fixed 320x672 canvas with a rail either side. Any window
   * shorter than about 780px cannot show all of it, and the bottom rows —
   * the ones that decide the game — are the ones that get cropped. Scale the
   * whole column down to fit instead: a smaller board is playable, most of a
   * board is not.
   */
  function fitStage() {
    var stage = $('.stage');
    var column = $('.match-column');
    if (!stage || !column) return;
    column.style.setProperty('--stage-scale', '1');
    if (!stage.clientHeight || !column.offsetHeight) return;

    var cs = getComputedStyle(stage);
    var availW = stage.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    var availH = stage.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    var scale = Math.min(1, availW / column.offsetWidth, availH / column.offsetHeight);
    // Below this the board is too small to read; the window is the problem.
    column.style.setProperty('--stage-scale', String(Math.max(0.4, Math.floor(scale * 1000) / 1000)));
  }

  /* ----------------------------------------------------------------- audio */

  var audioCtx = null;
  function beep(freq, durationMs, type, gain) {
    if (!window.CONFIG || !CONFIG.sound) return;
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      var osc = audioCtx.createOscillator();
      var vol = audioCtx.createGain();
      osc.type = type || 'square';
      osc.frequency.value = freq;
      vol.gain.setValueAtTime(gain === undefined ? 0.05 : gain, audioCtx.currentTime);
      vol.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + durationMs / 1000);
      osc.connect(vol).connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + durationMs / 1000);
    } catch (e) {}
  }

  return {
    mulberry32: mulberry32,
    $: $, $$: $$, el: el, clear: clear, escapeHtml: escapeHtml,
    fmtTime: fmtTime, fmtTimeMs: fmtTimeMs, fmtNum: fmtNum, fmtAgo: fmtAgo, clamp: clamp,
    load: load, save: save, drop: drop,
    countUp: countUp, replay: replay, reduceMotion: reduceMotion,
    toast: toast, modal: modal, closeModal: closeModal,
    paintRankBadge: paintRankBadge, pickTextColor: pickTextColor,
    viewport: viewport, applyViewport: applyViewport, watchViewport: watchViewport,
    fitStage: fitStage,
    beep: beep
  };
})();
</script>

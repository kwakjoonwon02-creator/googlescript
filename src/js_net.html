<script>
/* ================================================================== net ==
   Promise wrapper around google.script.run, plus the credential handling.

   Apps Script round trips are ~150-500ms, so the versus loop sends one
   combined sync() per tick rather than several small calls, and never lets
   two syncs overlap.
   ========================================================================= */

var Net = (function () {
  var creds = U.load('creds', null);
  var serverOffset = 0;        // serverTime - Date.now(), for the countdown
  var lastLatency = 0;

  /**
   * Methods the realtime relay answers when one is configured. Everything
   * else — accounts, ratings, the ladder — always goes to Apps Script, which
   * owns the spreadsheet.
   */
  var RELAY_METHODS = {
    queueJoin: 1, queuePoll: 1, queueLeave: 1,
    roomCreate: 1, roomJoin: 1, roomLeave: 1, roomConfig: 1, roomList: 1,
    chatSend: 1, sync: 1
  };

  var CONNECT_TIMEOUT_MS = 5000;
  var CALL_TIMEOUT_MS = 9000;
  var MAX_RECONNECTS = 6;
  var RESUME_WAIT_MS = 4000;

  /**
   * off          no relay configured, or the first connection never came up
   * connecting   opening the socket for the first time
   * on           connected; relay methods go over the socket
   * reconnecting dropped after having worked; calls wait rather than falling
   *              back, because the rooms live on the relay and Apps Script
   *              has never heard of them
   */
  var relay = {
    mode: 'off',
    url: null,
    ticket: null,
    ws: null,
    seq: 0,
    waiting: {},
    attempts: 0,
    resumeQueue: []
  };

  function available() {
    return typeof google !== 'undefined' && google.script && google.script.run;
  }

  /* ---------------------------------------------------------- relay link */

  function relayReady() { return relay.mode === 'on'; }
  function relayActive() { return relay.mode === 'on' || relay.mode === 'reconnecting'; }

  function relaySend(method, payload) {
    return new Promise(function (resolve, reject) {
      var id = ++relay.seq;
      relay.waiting[id] = { resolve: resolve, reject: reject };
      var timer = setTimeout(function () {
        if (relay.waiting[id]) {
          delete relay.waiting[id];
          reject(new Error('릴레이 응답이 없습니다.'));
        }
      }, CALL_TIMEOUT_MS);
      relay.waiting[id].timer = timer;
      try {
        relay.ws.send(JSON.stringify({ i: id, m: method, p: payload || {} }));
      } catch (err) {
        clearTimeout(timer);
        delete relay.waiting[id];
        reject(err);
      }
    });
  }

  /** Holds a call while the socket comes back, instead of failing outright. */
  function relayCall(method, payload) {
    if (relayReady()) return relaySend(method, payload);
    return new Promise(function (resolve, reject) {
      var entry = {
        resolve: resolve, reject: reject, method: method, payload: payload,
        expires: Date.now() + RESUME_WAIT_MS
      };
      relay.resumeQueue.push(entry);
    });
  }

  function flushResumeQueue(failure) {
    var pending = relay.resumeQueue;
    relay.resumeQueue = [];
    pending.forEach(function (entry) {
      if (failure) { entry.reject(failure); return; }
      if (Date.now() > entry.expires) {
        entry.reject(new Error('릴레이 재연결에 실패했습니다.'));
        return;
      }
      relaySend(entry.method, entry.payload).then(entry.resolve, entry.reject);
    });
  }

  function rejectInFlight(reason) {
    Object.keys(relay.waiting).forEach(function (id) {
      var entry = relay.waiting[id];
      delete relay.waiting[id];
      clearTimeout(entry.timer);
      entry.reject(new Error(reason));
    });
  }

  function openRelay() {
    return new Promise(function (settle) {
      var socket;
      try {
        socket = new WebSocket(relay.url);
      } catch (err) {
        settle(false);
        return;
      }
      relay.ws = socket;
      var done = false;
      var finish = function (ok) { if (!done) { done = true; settle(ok); } };
      var timer = setTimeout(function () { finish(false); try { socket.close(); } catch (e) {} },
                             CONNECT_TIMEOUT_MS);

      socket.onopen = function () {
        var id = ++relay.seq;
        relay.waiting[id] = {
          resolve: function () {
            clearTimeout(timer);
            relay.mode = 'on';
            relay.attempts = 0;
            finish(true);
            flushResumeQueue(null);
          },
          reject: function (err) {
            clearTimeout(timer);
            console.warn('relay refused the ticket: ' + err.message);
            finish(false);
          }
        };
        socket.send(JSON.stringify({ i: id, m: 'hello', p: { ticket: relay.ticket } }));
      };

      socket.onmessage = function (event) {
        var msg;
        try { msg = JSON.parse(event.data); } catch (e) { return; }
        var entry = relay.waiting[msg.i];
        if (!entry) return;
        delete relay.waiting[msg.i];
        clearTimeout(entry.timer);
        if (msg.t) serverOffset = msg.t - Date.now();
        if (msg.ok) entry.resolve(msg.d);
        else entry.reject(new Error(msg.e || '릴레이 오류'));
      };

      socket.onclose = function () {
        clearTimeout(timer);
        rejectInFlight('릴레이 연결이 끊어졌습니다.');
        if (relay.mode === 'on' || relay.mode === 'reconnecting') {
          relay.mode = 'reconnecting';
          scheduleReconnect();
        }
        finish(false);
      };

      socket.onerror = function () { /* onclose always follows */ };
    });
  }

  function scheduleReconnect() {
    if (relay.attempts >= MAX_RECONNECTS) {
      relay.mode = 'off';
      flushResumeQueue(new Error('릴레이에 다시 연결하지 못했습니다.'));
      return;
    }
    var wait = Math.min(8000, 400 * Math.pow(2, relay.attempts));
    relay.attempts++;
    setTimeout(function () {
      if (relay.mode !== 'reconnecting') return;
      openRelay();
    }, wait);
  }

  /* --------------------------------------------------------------- calls */

  function call(method, payload) {
    if (relayActive() && RELAY_METHODS[method]) return relayCall(method, payload);
    return appsScriptCall(method, payload);
  }

  function appsScriptCall(method, payload) {
    return new Promise(function (resolve, reject) {
      if (!available()) {
        reject(new Error('Apps Script 런타임에 연결할 수 없습니다. 웹앱 URL로 접속했는지 확인하세요.'));
        return;
      }
      var started = Date.now();
      google.script.run
        .withSuccessHandler(function (res) {
          lastLatency = Date.now() - started;
          if (!res) { reject(new Error('빈 응답')); return; }
          if (res.ok === false) { reject(new Error(res.error || '알 수 없는 오류')); return; }
          if (res.t) serverOffset = res.t - Date.now() + Math.floor(lastLatency / 2);
          resolve(res.data);
        })
        .withFailureHandler(function (err) {
          lastLatency = Date.now() - started;
          reject(new Error((err && err.message) || String(err)));
        })
        .rpc(method, payload || {});
    });
  }

  /** Retries transient failures with a short backoff. */
  function callRetry(method, payload, attempts) {
    var max = attempts === undefined ? 3 : attempts;
    return call(method, payload).catch(function (err) {
      if (max <= 1) throw err;
      var wait = (4 - max) * 600 + 400;
      return new Promise(function (r) { setTimeout(r, wait); })
        .then(function () { return callRetry(method, payload, max - 1); });
    });
  }

  function authed(payload) {
    return Object.assign({ id: creds && creds.id, token: creds && creds.token }, payload || {});
  }

  function bootstrap(name) {
    return appsScriptCall('bootstrap', {
      id: creds && creds.id,
      token: creds && creds.token,
      name: name
    }).then(function (data) {
      creds = data.credentials;
      U.save('creds', creds);
      // The clock offset is already set by call() with a latency correction;
      // recomputing it here from the payload alone would be less accurate.
      window.RANK_COLORS = {};
      data.ranks.ladder.forEach(function (r) { window.RANK_COLORS[r.name] = r.color; });
      window.RANK_COLORS[data.ranks.unranked.name] = data.ranks.unranked.color;
      window.RANK_TABLE = data.ranks;
      window.RULE_SCHEMA = data.rules || {};

      // A configured relay is tried once. If it does not come up we stay on
      // Apps Script polling rather than leaving the player stranded.
      if (data.relay && data.relay.url && data.relay.ticket && typeof WebSocket !== 'undefined') {
        relay.url = data.relay.url;
        relay.ticket = data.relay.ticket;
        relay.mode = 'connecting';
        return openRelay().then(function (ok) {
          if (!ok) {
            relay.mode = 'off';
            console.warn('relay unavailable; using Apps Script polling');
          }
          return data;
        });
      }
      return data;
    });
  }

  /* ---------------------------------------------------------- sync loop */

  var syncInFlight = false;

  /**
   * One versus tick. Silently drops the call if the previous one has not
   * come back yet, so a slow round trip cannot pile up requests.
   */
  function sync(code, state, chatSince) {
    if (syncInFlight) return Promise.resolve(null);
    syncInFlight = true;
    return call('sync', authed({ code: code, state: state, chatSince: chatSince || 0 }))
      .then(function (data) { syncInFlight = false; return data; })
      .catch(function (err) { syncInFlight = false; throw err; });
  }

  function resetSyncGate() { syncInFlight = false; }

  function serverNow() { return Date.now() + serverOffset; }

  return {
    available: available,
    call: call,
    isRelay: relayReady,
    relayMode: function () { return relay.mode; },
    /** Closes the socket so reconnect behaviour can be exercised. */
    __testCloseRelay: function () { if (relay.ws) relay.ws.close(); },
    callRetry: callRetry,
    authed: authed,
    bootstrap: bootstrap,
    sync: sync,
    resetSyncGate: resetSyncGate,
    serverNow: serverNow,
    latency: function () { return lastLatency; },
    creds: function () { return creds; },
    setName: function (name) { return call('setName', authed({ name: name })); },
    profile: function () { return call('profile', authed({})); },
    leaderboard: function () { return call('leaderboard', authed({ limit: 100 })); },
    submitSolo: function (payload) { return call('submitSolo', authed(payload)); },
    queueJoin: function () { return call('queueJoin', authed({})); },
    queuePoll: function () { return call('queuePoll', authed({})); },
    queueLeave: function () { return call('queueLeave', authed({})); },
    roomCreate: function (config) { return call('roomCreate', authed({ config: config })); },
    roomJoin: function (code, spectate) {
      return call('roomJoin', authed({ code: code, spectate: !!spectate }));
    },
    chatSend: function (code, text) { return call('chatSend', authed({ code: code, text: text })); },
    roomLeave: function (code) { return call('roomLeave', authed({ code: code })); },
    roomList: function () { return call('roomList', authed({})); },
    roomConfig: function (code, config) { return call('roomConfig', authed({ code: code, config: config })); }
  };
})();
</script>

<script>
/* ================================================================== app ==
   Screens, navigation, and everything that is not the game loop itself.
   ========================================================================= */

var App = (function () {

  var current = 'boot';
  var profile = null;
  var queueTimer = null;
  var queueStartedAt = 0;
  var pendingRoomConfig = { ft: 3, maxPlayers: 2, isPrivate: false, targeting: 'random' };
  var lbTab = 'ranked';
  var lbData = null;
  var chatHistory = [];
  var CHAT_KEEP = 60;

  /**
   * Presentation for each room rule. The server publishes types and ranges;
   * this adds the label, the step size and the display order.
   */
  var RULE_META = {
    ft:                { label: 'First to', step: 1, hint: '먼저 N라운드 승리' },
    maxPlayers:        { label: '최대 인원', step: 1, hint: '2~4인' },
    targeting:         { label: '타겟팅', hint: '3인 이상일 때 공격 대상',
                         names: { random: '랜덤', even: '균등', attackers: '보복', badges: '1위 집중' } },
    gravity:           { label: '중력', step: 0.1, unit: '줄/초' },
    gravityIncrease:   { label: '중력 증가', step: 0.05, unit: '줄/초', hint: '일정 시간마다 가속' },
    gravityEvery:      { label: '증가 주기', step: 5000, unit: 'ms' },
    lockDelay:         { label: '락 딜레이', step: 50, unit: 'ms' },
    lockResets:        { label: '무브 리셋', step: 1, unit: '회' },
    nextCount:         { label: '넥스트 개수', step: 1, unit: '개' },
    allowHold:         { label: '홀드 허용' },
    garbageMultiplier: { label: '가비지 배율', step: 0.1, unit: '×' },
    garbageDelayMs:    { label: '가비지 지연', step: 50, unit: 'ms', hint: '상쇄 가능 시간' },
    garbageCap:        { label: '가비지 상한', step: 1, unit: '줄', hint: '착지 1회당' },
    garbageHoleRepeat: { label: '구멍 유지 확률', step: 0.05 }
  };
  var RULE_ORDER = ['ft', 'maxPlayers', 'targeting', 'gravity', 'gravityIncrease',
    'gravityEvery', 'lockDelay', 'lockResets', 'nextCount', 'allowHold',
    'garbageMultiplier', 'garbageDelayMs', 'garbageCap', 'garbageHoleRepeat'];

  function formatRule(key, value) {
    var meta = RULE_META[key] || {};
    var spec = (window.RULE_SCHEMA || {})[key] || {};
    if (spec.type === 'bool') return value ? 'ON' : 'OFF';
    if (spec.type === 'enum') return (meta.names && meta.names[value]) || value;
    var text = spec.type === 'int' ? String(value) : String(Math.round(Number(value) * 100) / 100);
    return text + (meta.unit ? ' ' + meta.unit : '');
  }

  /* ------------------------------------------------------------ screens */

  function showScreen(name) {
    var changed = current !== name;
    U.$$('.screen').forEach(function (s) { s.classList.remove('active'); });
    var node = U.$('#screen-' + name);
    if (node) node.classList.add('active');
    var previous = current;
    current = name;
    document.body.classList.toggle('in-game', name === 'game');
    // The board only has a measurable size once its screen is displayed.
    if (name === 'game') U.fitStage();
    // The wipe reads as a transition, not a flash, so it only runs when the
    // screen actually changed and never on the very first paint.
    if (changed && previous !== 'boot' && CONFIG.transitions) U.replay(U.$('#wipe'), 'run');
  }

  function currentScreen() { return current; }

  /* ------------------------------------------------------------ profile */

  function updateProfile(p) {
    if (!p) return;
    profile = p;
    U.$('#me-name').textContent = p.name;
    var trNode = U.$('#me-tr');
    var shownTr = Number(String(trNode.textContent).replace(/[^0-9]/g, '')) || 0;
    U.countUp(trNode, Math.round(p.tr), { from: shownTr, ms: shownTr ? 700 : 1200 });
    U.$('#me-record').textContent = p.wins + 'W ' + p.losses + 'L';
    U.paintRankBadge(U.$('#me-rank'), p.rank, p.rankColor);
    U.$('#ranked-tr').textContent = Math.round(p.tr).toLocaleString();

    U.$('#me-apm').textContent = U.fmtNum(p.apm, 1);
    U.$('#me-pps').textContent = U.fmtNum(p.pps, 2);
    U.$('#me-vs').textContent = U.fmtNum(p.vs, 1);
    U.$('#me-sprint').textContent = p.sprintBest ? U.fmtTimeMs(p.sprintBest) : '—';
    U.$('#me-blitz').textContent = p.blitzBest ? p.blitzBest.toLocaleString() : '—';
    U.$('#me-peak').textContent = p.peakTr ? Math.round(p.peakTr).toLocaleString() : '—';

    U.$('#solo-sprint-best').textContent = p.sprintBest ? U.fmtTimeMs(p.sprintBest) : '—';
    U.$('#solo-blitz-best').textContent = p.blitzBest ? p.blitzBest.toLocaleString() : '—';

    var placement = U.$('#me-placement');
    if (p.placementsLeft > 0) {
      placement.textContent = '배치 경기 ' + (10 - p.placementsLeft) + '/10 — ' +
        p.placementsLeft + '경기 더 치르면 랭크가 부여됩니다.';
    } else {
      var streak = Number(p.streak) || 0;
      placement.textContent = '최고 랭크 ' + (p.bestRank || p.rank) +
        ' · ' + (streak >= 0 ? streak + '연승' : (-streak) + '연패') +
        ' · 최고 TR ' + Math.round(p.peakTr).toLocaleString();
    }

    var nameField = U.$('#cfg-name');
    if (nameField && document.activeElement !== nameField) nameField.value = p.name;

    var identity = U.$('#identity');
    if (identity) identity.classList.toggle('guest', !!p.guest);
  }

  function refreshProfile() {
    return Net.profile().then(function (data) {
      updateProfile(data.profile);
      renderHistory(data.history);
      return data;
    }).catch(function () {});
  }

  function renderHistory(history) {
    var host = U.$('#recent-matches');
    U.clear(host);
    if (!history || !history.length) {
      host.appendChild(U.el('div', { class: 'empty', text: '아직 기록이 없습니다' }));
      return;
    }
    history.forEach(function (m) {
      var delta = m.trDelta;
      host.appendChild(U.el('div', {
        class: 'switch-row',
        html:
          '<div class="switch-label"><b style="color:' + (m.won ? 'var(--good)' : 'var(--bad)') + '">' +
          (m.won ? 'WIN' : 'LOSS') + '</b> vs ' + U.escapeHtml(m.opponent) +
          '<small>' + (m.mode === 'ranked' ? 'RANKED' : 'CASUAL') + ' · ' +
          U.escapeHtml(m.score) + ' · ' + U.fmtAgo(m.ts) + '</small></div>' +
          (m.mode === 'ranked'
            ? '<div class="mono ' + (delta >= 0 ? 'up' : 'down') + '">' +
              (delta >= 0 ? '+' : '') + delta + '</div>'
            : '<div class="mono faint">—</div>')
      }));
    });
  }

  /* ---------------------------------------------------------- bootstrap */

  function boot() {
    U.$('#boot-status').textContent = '서버에 연결하는 중…';
    buildKeybindUI();
    Net.bootstrap().then(function (data) {
      if (data.authed) { enterApp(data); return; }
      showScreen('auth');
      setTimeout(function () { U.$('#auth-name').focus(); }, 80);
    }).catch(function (err) {
      U.$('#boot-status').innerHTML = '연결 실패: ' + U.escapeHtml(err.message) +
        '<br><br><button class="btn sm" onclick="location.reload()">다시 시도</button>';
    });
  }

  /** Signed in: fill everything the menu shows and go. */
  function enterApp(data) {
    updateProfile(data.profile);
    syncConfigUI();
    showScreen('menu');
    refreshProfile();
  }

  /* ------------------------------------------------------------ sign in */

  var authMode = 'login';

  function setAuthMode(mode) {
    authMode = mode;
    U.$$('[data-auth-tab]').forEach(function (tab) {
      tab.classList.toggle('active', tab.getAttribute('data-auth-tab') === mode);
    });
    var isNew = mode === 'register';
    U.$('#auth-pw2-field').hidden = !isNew;
    U.$('#auth-submit').textContent = isNew ? '계정 만들기' : '로그인';
    U.$('#auth-pw').setAttribute('autocomplete', isNew ? 'new-password' : 'current-password');
    authError('');
  }

  function authError(message) {
    var node = U.$('#auth-error');
    node.textContent = message || '';
    node.classList.toggle('show', !!message);
  }

  function authBusy(busy) {
    U.$('#auth-submit').disabled = busy;
    U.$('#auth-guest').disabled = busy;
  }

  function submitAuth() {
    var name = U.$('#auth-name').value.trim();
    var pw = U.$('#auth-pw').value;

    if (authMode === 'register' && pw !== U.$('#auth-pw2').value) {
      authError('비밀번호가 서로 다릅니다.');
      return;
    }

    authError('');
    authBusy(true);
    var request = authMode === 'register' ? Net.register(name, pw) : Net.login(name, pw);
    request.then(function (data) {
      U.$('#auth-pw').value = '';
      U.$('#auth-pw2').value = '';
      enterApp(data);
      U.toast(authMode === 'register' ? '환영합니다, ' + data.profile.name + '님' : '다시 오셨군요, ' + data.profile.name + '님', 'good');
    }).catch(function (err) {
      authError(err.message);
    }).then(function () { authBusy(false); });
  }

  function wireAuth() {
    U.$$('[data-auth-tab]').forEach(function (tab) {
      tab.addEventListener('click', function () { setAuthMode(tab.getAttribute('data-auth-tab')); });
    });
    U.$('#auth-form').addEventListener('submit', function (e) {
      e.preventDefault();
      submitAuth();
    });
    // The game listens for keys globally; the sign-in screen must not.
    ['#auth-name', '#auth-pw', '#auth-pw2'].forEach(function (sel) {
      U.$(sel).addEventListener('keydown', function (e) { e.stopPropagation(); });
    });
    U.$('#auth-guest').addEventListener('click', function () {
      authError('');
      authBusy(true);
      Net.guest().then(function (data) {
        enterApp(data);
        U.toast('게스트로 시작합니다. 설정에서 언제든 계정으로 바꿀 수 있습니다.');
      }).catch(function (err) {
        authError(err.message);
      }).then(function () { authBusy(false); });
    });
  }

  function signOut() {
    Net.logout().catch(function () { Net.forget(); }).then(function () {
      profile = null;
      showScreen('auth');
      setAuthMode('login');
      U.$('#auth-name').value = '';
      U.$('#auth-pw').value = '';
      U.toast('로그아웃되었습니다.');
    });
  }

  /**
   * Sets a password, and for a guest that is also how the account stops
   * being throwaway: same records, same ratings, now with a way back in.
   */
  function askPassword() {
    var isGuest = !profile || profile.guest;
    var name = U.el('input', { class: 'input', maxlength: 16, value: profile ? profile.name : '' });
    var current = U.el('input', { class: 'input', type: 'password', maxlength: 72 });
    var next = U.el('input', { class: 'input', type: 'password', maxlength: 72 });
    var again = U.el('input', { class: 'input', type: 'password', maxlength: 72 });
    var msg = U.el('p', { class: 'hint', text: isGuest
      ? '지금까지의 기록을 그대로 가진 계정이 됩니다.'
      : '현재 비밀번호를 확인한 뒤 새 비밀번호로 바꿉니다.' });
    var save = U.el('button', { class: 'btn primary wide', text: isGuest ? '계정 만들기' : '변경' });
    var cancel = U.el('button', { class: 'btn ghost wide', text: '취소', style: 'margin-top:8px' });

    var fields = [];
    if (isGuest) fields.push(U.el('div', { class: 'field' }, [U.el('label', { text: '닉네임' }), name]));
    else fields.push(U.el('div', { class: 'field' }, [U.el('label', { text: '현재 비밀번호' }), current]));
    fields.push(U.el('div', { class: 'field' }, [U.el('label', { text: '새 비밀번호' }), next]));
    fields.push(U.el('div', { class: 'field' }, [U.el('label', { text: '새 비밀번호 확인' }), again]));

    var box = U.el('div', {}, [
      U.el('div', { class: 'panel-title', text: isGuest ? '계정 만들기' : '비밀번호 변경' })
    ].concat(fields, [msg, U.el('div', { style: 'height:14px' }), save, cancel]));

    [name, current, next, again].forEach(function (input) {
      input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') save.click();
        e.stopPropagation();
      });
    });
    cancel.addEventListener('click', U.closeModal);

    save.addEventListener('click', function () {
      if (next.value !== again.value) {
        msg.textContent = '비밀번호가 서로 다릅니다.';
        msg.style.color = 'var(--bad)';
        return;
      }
      save.disabled = true;
      Net.setPassword({
        name: isGuest ? name.value.trim() : undefined,
        current: isGuest ? undefined : current.value,
        password: next.value
      }).then(function (res) {
        updateProfile(res.profile);
        syncConfigUI();
        U.closeModal();
        U.toast(isGuest ? '계정이 만들어졌습니다.' : '비밀번호가 변경되었습니다.', 'good');
      }).catch(function (err) {
        msg.textContent = err.message;
        msg.style.color = 'var(--bad)';
        save.disabled = false;
      });
    });

    U.modal(box);
    setTimeout(function () { (isGuest ? name : current).focus(); }, 60);
  }

  function askName(isNew) {
    var input = U.el('input', { class: 'input', maxlength: 16, value: profile ? profile.name : '' });
    var msg = U.el('p', { class: 'hint', text: '2~16자 · 한글/영문/숫자/_-. 사용 가능' });
    var save = U.el('button', { class: 'btn primary wide', text: '확인' });
    var box = U.el('div', {}, [
      U.el('div', { class: 'panel-title', text: isNew ? '닉네임을 정해주세요' : '닉네임 변경' }),
      input, msg, U.el('div', { style: 'height:14px' }), save
    ]);
    if (!isNew) {
      var cancel = U.el('button', { class: 'btn ghost wide', text: '취소', style: 'margin-top:8px' });
      cancel.addEventListener('click', U.closeModal);
      box.appendChild(cancel);
    }
    save.addEventListener('click', function () {
      var value = input.value.trim();
      save.disabled = true;
      Net.setName(value).then(function (res) {
        updateProfile(res.profile);
        U.closeModal();
        U.toast('닉네임이 설정되었습니다.', 'good');
      }).catch(function (err) {
        msg.textContent = err.message;
        msg.style.color = 'var(--bad)';
        save.disabled = false;
      });
    });
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') save.click();
      e.stopPropagation();
    });
    U.modal(box);
    setTimeout(function () { input.focus(); input.select(); }, 60);
  }

  /* --------------------------------------------------------------- menu */

  function wireMenu() {
    U.$$('[data-nav]').forEach(function (node) {
      node.addEventListener('click', function () {
        var target = node.getAttribute('data-nav');
        if (target === 'menu') { showScreen('menu'); refreshProfile(); }
        else if (target === 'solo') showScreen('solo');
        else if (target === 'multi') { showScreen('multi'); loadRooms(); }
        else if (target === 'ranked') startRanked();
        else if (target === 'cpu') pickCpuLevel();
        else if (target === 'leaderboard') openLeaderboard();
      });
    });

    U.$$('[data-solo]').forEach(function (node) {
      node.addEventListener('click', function () {
        Game.startSolo(node.getAttribute('data-solo'));
      });
    });

    U.$('#identity').addEventListener('click', function () { askName(false); });
    U.$('#btn-config').addEventListener('click', function () { showScreen('config'); syncConfigUI(); });
    U.$('#btn-about').addEventListener('click', showAbout);
  }

  function showAbout() {
    U.modal(U.el('div', {
      html:
        '<div class="panel-title">TETRA.GS · v' + U.escapeHtml(window.APP_INFO.version) + '</div>' +
        '<p class="hint" style="line-height:1.7">' +
        'Google Apps Script 위에서 동작하는 테트리스입니다. 소켓을 쓸 수 없어 대전은 ' +
        '약 0.3초 간격의 폴링으로 동기화되며, 두 클라이언트는 같은 시드로 동일한 7-bag을 생성합니다.<br><br>' +
        '<b>레이팅</b> — Glicko-2로 계산하고 TR(0~25,000)로 표시합니다. 10경기를 치르면 ' +
        '래더 백분위에 따라 D부터 X+까지의 랭크가 부여됩니다.<br><br>' +
        '<b>조작</b> — ← → 이동 · ↓ 소프트드롭 · SPACE 하드드롭 · ↑/X 회전 · Z 역회전 · A 180° · C/SHIFT 홀드 · R 재시작 · ESC 나가기' +
        '</p><div style="height:16px"></div>'
    }, [U.el('button', { class: 'btn wide', text: '닫기', onclick: U.closeModal })]));
  }

  /* --------------------------------------------------------------- solo */

  function pickCpuLevel() {
    var box = U.el('div', {});
    box.appendChild(U.el('div', { class: 'panel-title', text: 'CPU 난이도 선택' }));
    AI.levels.forEach(function (lv, i) {
      var btn = U.el('div', {
        class: 'menu-item',
        style: '--item-color:' + ['#46d17f', '#8fd14b', '#ffd24d', '#ff8a3d', '#ff4d6a'][i],
        html: '<div class="menu-icon">' + (i + 1) + '</div>' +
              '<div class="menu-text"><div class="menu-title" style="font-size:18px">' + lv.name + '</div>' +
              '<div class="menu-desc">' + lv.pps.toFixed(2) + ' PPS 목표</div></div>'
      });
      btn.addEventListener('click', function () {
        CONFIG.cpuLevel = i + 1;
        saveConfig();
        U.closeModal();
        Game.startCpu(i + 1);
      });
      box.appendChild(btn);
    });
    box.appendChild(U.el('div', { style: 'height:12px' }));
    box.appendChild(U.el('button', { class: 'btn ghost wide', text: '취소', onclick: U.closeModal }));
    U.modal(box);
  }

  /* ------------------------------------------------------------- ranked */

  var QUEUE_POLL_MS = 2200;

  /**
   * Join and poll return the same shape, and joining can pair you on the
   * spot — so both go through here. Handling `matched` only on poll would
   * strand whoever completes the pair, because the server has already taken
   * their queue entry.
   */
  function handleQueueStatus(status) {
    if (status.matched) {
      stopQueue();
      U.$('#queue-title').textContent = '매치 성사!';
      enterRoom(status.room, true, 'player');
      return true;
    }
    paintQueue(status);
    return false;
  }

  function queueFailed(err) {
    U.toast(err.message, 'error');
    stopQueue();
    showScreen('menu');
  }

  function startRanked() {
    if (profile && profile.guest) {
      U.toast('경쟁 모드는 계정이 필요합니다.', 'error');
      askPassword();
      return;
    }
    showScreen('queue');
    queueStartedAt = Date.now();
    U.$('#queue-title').textContent = '상대를 찾는 중…';
    Net.queueJoin().then(function (status) {
      if (handleQueueStatus(status)) return;
      stopQueue();
      queueTimer = setInterval(pollQueue, QUEUE_POLL_MS);
    }).catch(queueFailed);
  }

  function pollQueue() {
    Net.queuePoll().then(handleQueueStatus).catch(queueFailed);
  }

  function paintQueue(status) {
    U.$('#queue-elapsed').textContent = ((Date.now() - queueStartedAt) / 1000).toFixed(1);
    U.$('#queue-count').textContent = status.waiting || 0;
    U.$('#queue-band').textContent = (status.band || 800).toLocaleString();
  }

  function stopQueue() {
    if (queueTimer) clearInterval(queueTimer);
    queueTimer = null;
  }

  /* ---------------------------------------------------------- multiplayer */

  function wireMulti() {
    U.$$('[data-step]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var key = btn.getAttribute('data-step');
        var delta = Number(btn.getAttribute('data-delta'));
        if (key === 'ft') {
          pendingRoomConfig.ft = U.clamp(pendingRoomConfig.ft + delta, 1, 9);
          U.$('#cfg-ft').textContent = pendingRoomConfig.ft;
        } else if (key === 'max') {
          pendingRoomConfig.maxPlayers = U.clamp(pendingRoomConfig.maxPlayers + delta, 2, 4);
          U.$('#cfg-max').textContent = pendingRoomConfig.maxPlayers;
        } else if (key === 'cpu') {
          CONFIG.cpuLevel = U.clamp(CONFIG.cpuLevel + delta, 1, 5);
          saveConfig();
          syncConfigUI();
        }
      });
    });

    U.$('#cfg-private').addEventListener('click', function () {
      pendingRoomConfig.isPrivate = !pendingRoomConfig.isPrivate;
      this.textContent = pendingRoomConfig.isPrivate ? 'ON' : 'OFF';
      this.classList.toggle('primary', pendingRoomConfig.isPrivate);
    });

    U.$('#btn-create-room').addEventListener('click', function () {
      var btn = this;
      btn.disabled = true;
      Net.roomCreate(pendingRoomConfig).then(function (res) {
        enterRoom(res.room, false, 'player');
      }).catch(function (err) {
        U.toast(err.message, 'error');
      }).then(function () { btn.disabled = false; });
    });

    U.$('#btn-join-code').addEventListener('click', function () { joinByCode(false); });
    U.$('#btn-spectate-code').addEventListener('click', function () { joinByCode(true); });
    U.$('#join-code').addEventListener('keydown', function (e) {
      e.stopPropagation();
      if (e.key === 'Enter') joinByCode(false);
    });

    U.$('#cfg-targeting').addEventListener('click', function () {
      var values = ((window.RULE_SCHEMA || {}).targeting || {}).values || ['random'];
      var at = values.indexOf(pendingRoomConfig.targeting);
      pendingRoomConfig.targeting = values[(at + 1) % values.length];
      this.textContent = RULE_META.targeting.names[pendingRoomConfig.targeting] ||
                         pendingRoomConfig.targeting;
    });

    U.$('#btn-chat-send').addEventListener('click', sendChat);
    U.$('#chat-input').addEventListener('keydown', function (e) {
      e.stopPropagation();
      if (e.key === 'Enter') sendChat();
    });

    U.$('#btn-toggle-seat').addEventListener('click', function () {
      var room = Game.state().room;
      if (!room) return;
      var toSpectator = !Game.isSpectating();
      Net.roomJoin(room.code, toSpectator).then(function (res) {
        enterRoom(res.room, false, res.role, null);
      }).catch(function (err) { U.toast(err.message, 'error'); });
    });
    U.$('#btn-refresh-rooms').addEventListener('click', loadRooms);
    U.$('#btn-leave-room').addEventListener('click', function () {
      Game.leave();
      showScreen('multi');
      loadRooms();
    });
    U.$('#btn-ready').addEventListener('click', function () {
      Game.setReady(!Game.isReady());
      paintReadyButton();
    });
    U.$('#room-code-big').addEventListener('click', function () {
      var code = this.textContent;
      if (navigator.clipboard) {
        navigator.clipboard.writeText(code).then(function () { U.toast('코드를 복사했습니다.', 'good'); });
      }
    });
  }

  function joinByCode(spectate) {
    var code = U.$('#join-code').value.trim().toUpperCase();
    if (code.length < 3) { U.toast('코드를 입력하세요.', 'error'); return; }
    Net.roomJoin(code, spectate).then(function (res) {
      enterRoom(res.room, false, res.role, res.reason);
    }).catch(function (err) { U.toast(err.message, 'error'); });
  }

  function loadRooms() {
    var host = U.$('#room-list');
    U.clear(host);
    host.appendChild(U.el('p', { class: 'hint', text: '불러오는 중…' }));
    Net.roomList().then(function (res) {
      U.clear(host);
      if (!res.rooms.length) {
        host.appendChild(U.el('p', { class: 'hint', text: '공개된 방이 없습니다. 직접 만들어 보세요.' }));
        return;
      }
      res.rooms.forEach(function (r) {
        var live = r.state !== 'lobby' && r.state !== 'matchover';
        var full = r.players >= r.max;
        var node = U.el('div', {
          class: 'menu-item',
          style: '--item-color:' + (live ? '#46d17f' : '#b455e5'),
          html: '<div class="menu-icon">' + U.escapeHtml(r.code.slice(0, 2)) + '</div>' +
                '<div class="menu-text"><div class="menu-title" style="font-size:18px">' +
                U.escapeHtml(r.name) + '</div><div class="menu-desc">' +
                'FT' + r.ft + ' · ' + (RULE_META.targeting.names[r.targeting] || r.targeting) +
                ' · ' + (live ? '경기 중' : '대기 중') +
                (r.spectators ? ' · 관전 ' + r.spectators + '명' : '') + '</div></div>' +
                '<div class="menu-meta">' + r.players + '/' + r.max +
                '<br><span class="faint">' + (live || full ? '관전으로 입장' : '참가') + '</span></div>'
        });
        node.addEventListener('click', function () {
          Net.roomJoin(r.code, live || full).then(function (res2) {
            enterRoom(res2.room, false, res2.role, res2.reason);
          }).catch(function (err) { U.toast(err.message, 'error'); });
        });
        host.appendChild(node);
      });
    }).catch(function (err) {
      U.clear(host);
      host.appendChild(U.el('p', { class: 'hint', text: '목록을 불러오지 못했습니다: ' + err.message }));
    });
  }

  function enterRoom(room, autoReady, role, reason) {
    var spectating = role === 'spectator';
    chatHistory = [];
    Game.startVersus(room, spectating);
    Game.setReady(!spectating && !!autoReady);
    showScreen('room');
    renderRoom(room, {}, Game.isReady());
    renderChat();

    if (spectating) {
      U.$('#room-hint').textContent = '관전 중입니다. 자리가 나면 참가할 수 있습니다.';
      if (reason === 'full') U.toast('방이 가득 차 관전으로 입장했습니다.');
      else if (reason === 'in-progress') U.toast('경기가 진행 중이라 관전으로 입장했습니다.');
    } else {
      U.$('#room-hint').textContent = autoReady
        ? '상대가 준비되면 자동으로 시작합니다.'
        : '모든 플레이어가 준비하면 시작합니다.';
    }
  }

  function renderRoom(room, opponents, ready) {
    var myId = Net.creds().id;
    var spectating = Game.isSpectating();
    var isHost = room.host === myId;

    U.$('#room-title').textContent = room.mode === 'ranked' ? 'Ranked Match' : 'Room';
    U.$('#room-code-badge').textContent = room.code;
    U.$('#room-code-big').textContent = room.code;
    U.$('#room-mode-badge').textContent = room.mode === 'ranked' ? 'RANKED' : 'CASUAL';
    U.$('#room-count').textContent = '(' + room.players.length + '/' + room.config.maxPlayers + ')';

    var host = U.$('#room-players');
    U.clear(host);
    room.players.forEach(function (p) {
      var isMe = p.id === myId;
      var isReady = isMe ? ready : !!(opponents[p.id] && opponents[p.id].ready);
      var badge = U.el('div', { class: 'rank-badge sm' });
      U.paintRankBadge(badge, p.rank, p.rankColor);
      host.appendChild(U.el('div', {
        class: 'switch-row',
        style: 'align-items:center'
      }, [
        badge,
        U.el('div', {
          class: 'switch-label grow',
          html: '<b>' + U.escapeHtml(p.name) +
                (isMe ? ' <span class="badge">나</span>' : '') +
                (p.id === room.host ? ' <span class="badge hot">방장</span>' : '') + '</b>' +
                '<small>' + Math.round(p.tr).toLocaleString() + ' TR · ' + p.rank +
                (p.ko ? ' · ' + p.ko + ' KO' : '') + '</small>'
        }),
        U.el('span', {
          class: 'badge ' + (isReady ? 'live' : ''),
          text: isReady ? 'READY' : 'WAITING'
        })
      ]));
    });

    // Empty seats are drawn rather than left blank: "1/2" in a heading is a
    // fact, an outlined seat is the room telling you it is waiting.
    for (var free = room.players.length; free < room.config.maxPlayers; free++) {
      host.appendChild(U.el('div', {
        class: 'seat-open',
        text: '자리 비어 있음'
      }));
    }

    var bench = room.spectators || [];
    U.$('#room-spectator-count').textContent = '(' + bench.length + ')';
    var benchHost = U.$('#room-spectators');
    U.clear(benchHost);
    if (!bench.length) {
      benchHost.appendChild(U.el('span', { class: 'hint', text: '없음' }));
    } else {
      bench.forEach(function (v) {
        benchHost.appendChild(U.el('span', {
          class: 'badge' + (v.id === myId ? ' hot' : ''),
          text: v.name, style: 'margin:0 4px 4px 0'
        }));
      });
    }

    buildRuleEditor(room, isHost);

    var seatBtn = U.$('#btn-toggle-seat');
    var canSit = room.players.length < room.config.maxPlayers &&
                 (room.state === 'lobby' || room.state === 'matchover');
    seatBtn.style.display = room.mode === 'ranked' ? 'none' : 'block';
    seatBtn.textContent = spectating ? '자리에 앉기' : '관전으로 전환';
    seatBtn.disabled = spectating && !canSit;

    paintReadyButton();
  }

  /**
   * Builds the room rule list. The host gets controls; everyone else sees the
   * same rows read-only, so both sides are always looking at the same rules.
   */
  function buildRuleEditor(room, isHost) {
    var host = U.$('#room-rules');
    var schema = window.RULE_SCHEMA || {};
    U.clear(host);
    U.$('#room-rules-owner').textContent = isHost ? '(방장만 변경 가능)' : '(방장이 설정)';

    RULE_ORDER.forEach(function (key) {
      var spec = schema[key];
      if (!spec) return;
      var meta = RULE_META[key] || {};
      var value = room.config[key];

      var name = U.el('div', {
        class: 'rule-name',
        html: '<b>' + U.escapeHtml(meta.label || key) + '</b>' +
              (meta.hint ? '<small>' + U.escapeHtml(meta.hint) + '</small>' : '')
      });

      var control;
      if (!isHost || room.mode === 'ranked') {
        control = U.el('div', { class: 'rule-value', text: formatRule(key, value) });
      } else if (spec.type === 'bool') {
        control = U.el('button', {
          class: 'btn sm' + (value ? ' primary' : ''),
          text: formatRule(key, value),
          onclick: function () { commitRule(key, !value); }
        });
      } else if (spec.type === 'enum') {
        control = U.el('button', {
          class: 'btn sm',
          text: formatRule(key, value),
          onclick: function () {
            var at = spec.values.indexOf(value);
            commitRule(key, spec.values[(at + 1) % spec.values.length]);
          }
        });
      } else {
        var step = meta.step || 1;
        var display = U.el('div', { class: 'value', text: formatRule(key, value) });
        control = U.el('div', { class: 'stepper' }, [
          U.el('button', { text: '−', onclick: function () { nudgeRule(key, -step); } }),
          display,
          U.el('button', { text: '+', onclick: function () { nudgeRule(key, step); } })
        ]);
      }

      host.appendChild(U.el('div', {
        class: 'rule-row' + (isHost && room.mode !== 'ranked' ? '' : ' locked')
      }, [name, control]));
    });
  }

  function nudgeRule(key, delta) {
    var room = Game.state().room;
    if (!room) return;
    var spec = (window.RULE_SCHEMA || {})[key] || {};
    var next = Number(room.config[key]) + delta;
    if (spec.min !== undefined) next = Math.max(spec.min, next);
    if (spec.max !== undefined) next = Math.min(spec.max, next);
    next = Math.round(next * 1000) / 1000;
    commitRule(key, next);
  }

  /** Optimistic: paint the change immediately, let the server confirm. */
  function commitRule(key, value) {
    var room = Game.state().room;
    if (!room) return;
    room.config[key] = value;
    buildRuleEditor(room, room.host === Net.creds().id);
    var patch = {};
    patch[key] = value;
    Net.roomConfig(room.code, patch).then(function (res) {
      Game.state().room = res.room;
      buildRuleEditor(res.room, res.room.host === Net.creds().id);
    }).catch(function (err) {
      U.toast(err.message, 'error');
    });
  }

  /* ------------------------------------------------------------------ chat */

  function onChat(messages) {
    var inGame = current === 'game';
    messages.forEach(function (m) {
      chatHistory.push(m);
      if (inGame && m.id !== Net.creds().id) {
        U.toast(m.name + ': ' + m.text, null, 4000);
      }
    });
    if (chatHistory.length > CHAT_KEEP) chatHistory = chatHistory.slice(-CHAT_KEEP);
    renderChat();
  }

  function renderChat() {
    var log = U.$('#chat-log');
    if (!log) return;
    var pinned = log.scrollTop + log.clientHeight >= log.scrollHeight - 24;
    U.clear(log);
    if (!chatHistory.length) {
      log.appendChild(U.el('div', { class: 'empty', text: '아직 대화가 없습니다' }));
      return;
    }
    var myId = Net.creds() && Net.creds().id;
    chatHistory.forEach(function (m) {
      var when = new Date(Number(m.ts));
      log.appendChild(U.el('div', {
        class: 'chat-msg' + (m.id === myId ? ' mine' : '') + (m.spectator ? ' spectator' : ''),
        html: '<span class="when">' +
              String(when.getHours()).padStart(2, '0') + ':' +
              String(when.getMinutes()).padStart(2, '0') + '</span>' +
              '<span class="who">' + U.escapeHtml(m.name) + '</span>' +
              U.escapeHtml(m.text)
      }));
    });
    if (pinned) log.scrollTop = log.scrollHeight;
  }

  function sendChat() {
    var input = U.$('#chat-input');
    var text = input.value.trim();
    if (!text) return;
    var room = Game.state().room;
    if (!room) { U.toast('방에 있을 때만 사용할 수 있습니다.', 'error'); return; }
    input.value = '';
    Net.chatSend(room.code, text).catch(function (err) {
      U.toast(err.message, 'error');
      input.value = text;
    });
  }

  function paintReadyButton() {
    var btn = U.$('#btn-ready');
    if (Game.isSpectating()) {
      btn.style.display = 'none';
      return;
    }
    btn.style.display = 'block';
    var ready = Game.isReady();
    btn.textContent = ready ? '준비 완료 — 취소하려면 클릭' : '준비';
    btn.classList.toggle('primary', !ready);
    btn.classList.toggle('danger', ready);
  }

  /* -------------------------------------------------------- leaderboard */

  function openLeaderboard() {
    showScreen('leaderboard');
    var host = U.$('#lb-body');
    U.clear(host);
    host.appendChild(U.el('p', { class: 'hint', text: '불러오는 중…' }));
    Net.leaderboard().then(function (data) {
      lbData = data;
      U.$('#lb-meta').textContent = '전체 ' + data.totalPlayers + '명 · 랭크 보유 ' + data.rankedPlayers + '명';
      renderLeaderboard();
    }).catch(function (err) {
      U.clear(host);
      host.appendChild(U.el('p', { class: 'hint', text: '불러오지 못했습니다: ' + err.message }));
    });
  }

  function renderLeaderboard() {
    var host = U.$('#lb-body');
    U.clear(host);
    if (!lbData) return;
    var myId = Net.creds().id;

    if (lbTab === 'ranked') {
      if (!lbData.ranked.length) {
        host.appendChild(U.el('div', {
          class: 'empty',
          text: '아직 랭크가 부여된 플레이어가 없습니다 — 경쟁 10경기를 마치면 여기에 오릅니다'
        }));
        return;
      }
      var rows = lbData.ranked.map(function (r) {
        return '<tr class="' + (r.id === myId ? 'me ' : '') + 'top' + r.pos + '">' +
          '<td class="pos">#' + r.pos + '</td>' +
          '<td><span class="rank-badge xs" style="background:' + r.rankColor +
          ';color:' + U.pickTextColor(r.rankColor) + ';display:inline-grid">' + r.rank + '</span></td>' +
          '<td><b>' + U.escapeHtml(r.name) + '</b></td>' +
          '<td class="num">' + r.tr.toLocaleString() + '</td>' +
          '<td class="num">' + r.wins + 'W ' + r.losses + 'L</td>' +
          '<td class="num">' + U.fmtNum(r.apm, 1) + '</td>' +
          '<td class="num">' + U.fmtNum(r.pps, 2) + '</td></tr>';
      }).join('');
      host.innerHTML = '<table class="table"><thead><tr>' +
        '<th>#</th><th class="rank-col">RANK</th><th>PLAYER</th><th class="num">TR</th>' +
        '<th class="num">W/L</th><th class="num">APM</th><th class="num">PPS</th>' +
        '</tr></thead><tbody>' + rows + '</tbody></table>';
      return;
    }

    var list = lbTab === 'sprint' ? lbData.sprint : lbData.blitz;
    if (!list.length) {
      host.appendChild(U.el('div', { class: 'empty', text: '아직 기록이 없습니다' }));
      return;
    }
    var body = list.map(function (r) {
      var value = lbTab === 'sprint' ? U.fmtTimeMs(r.value) : r.value.toLocaleString();
      return '<tr class="' + (r.id === myId ? 'me ' : '') + 'top' + r.pos + '">' +
        '<td class="pos">#' + r.pos + '</td><td><b>' + U.escapeHtml(r.name) + '</b></td>' +
        '<td class="num">' + value + '</td></tr>';
    }).join('');
    host.innerHTML = '<table class="table"><thead><tr><th>#</th><th>PLAYER</th>' +
      '<th class="num">' + (lbTab === 'sprint' ? 'TIME' : 'SCORE') + '</th></tr></thead><tbody>' +
      body + '</tbody></table>';
  }

  function wireLeaderboard() {
    U.$$('[data-lb]').forEach(function (tab) {
      tab.addEventListener('click', function () {
        U.$$('[data-lb]').forEach(function (t) { t.classList.remove('active'); });
        tab.classList.add('active');
        lbTab = tab.getAttribute('data-lb');
        renderLeaderboard();
      });
    });
  }

  /* ------------------------------------------------------------- config */

  function syncConfigUI() {
    var guest = !profile || profile.guest;
    U.$('#cfg-account-note').textContent = guest
      ? '게스트 세션입니다. 비밀번호를 등록하면 지금까지의 기록을 그대로 가진 계정이 됩니다.'
      : '계정으로 로그인되어 있습니다. 닉네임이 곧 로그인 이름입니다.';
    U.$('#btn-password').textContent = guest ? '계정 만들기' : '비밀번호 변경';
    U.$('#btn-password').classList.toggle('primary', guest);

    U.$('#h-das').textContent = CONFIG.das;
    U.$('#h-arr').textContent = CONFIG.arr;
    U.$('#h-sdf').textContent = CONFIG.sdf >= 41 ? '∞' : CONFIG.sdf;
    U.$('#cfg-cpu').textContent = CONFIG.cpuLevel;
    U.$('#cfg-cpu-desc').textContent = AI.levels[CONFIG.cpuLevel - 1].name;
    U.$('#cfg-ft').textContent = pendingRoomConfig.ft;
    U.$('#cfg-max').textContent = pendingRoomConfig.maxPlayers;

    ['ghost', 'grid', 'shake', 'effects', 'transitions', 'sound'].forEach(function (key) {
      var btn = U.$('[data-toggle="' + key + '"]');
      if (!btn) return;
      btn.textContent = CONFIG[key] ? 'ON' : 'OFF';
      btn.classList.toggle('primary', !!CONFIG[key]);
    });
  }

  function wireConfig() {
    U.$$('[data-handling]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var key = btn.getAttribute('data-handling');
        var delta = Number(btn.getAttribute('data-delta'));
        if (key === 'das') CONFIG.das = U.clamp(CONFIG.das + delta, 0, 300);
        if (key === 'arr') CONFIG.arr = U.clamp(CONFIG.arr + delta, 0, 100);
        if (key === 'sdf') CONFIG.sdf = U.clamp(CONFIG.sdf + delta, 1, 41);
        saveConfig();
        syncConfigUI();
      });
    });

    U.$$('[data-toggle]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var key = btn.getAttribute('data-toggle');
        CONFIG[key] = !CONFIG[key];
        saveConfig();
        syncConfigUI();
      });
    });

    U.$('#btn-reset-config').addEventListener('click', function () {
      CONFIG.das = 100; CONFIG.arr = 0; CONFIG.sdf = 41;
      CONFIG.ghost = true; CONFIG.grid = true; CONFIG.shake = true;
      CONFIG.effects = true; CONFIG.transitions = true; CONFIG.sound = true;
      CONFIG.binds = Object.assign({}, Input.defaults);
      saveConfig();
      syncConfigUI();
      buildKeybindUI();
      U.toast('설정을 기본값으로 되돌렸습니다.', 'good');
    });

    U.$('#btn-save-name').addEventListener('click', function () {
      var value = U.$('#cfg-name').value.trim();
      Net.setName(value).then(function (res) {
        updateProfile(res.profile);
        U.toast('닉네임이 변경되었습니다.', 'good');
      }).catch(function (err) { U.toast(err.message, 'error'); });
    });
    U.$('#cfg-name').addEventListener('keydown', function (e) { e.stopPropagation(); });
    U.$('#btn-password').addEventListener('click', askPassword);
    U.$('#btn-logout').addEventListener('click', signOut);
  }

  function buildKeybindUI() {
    var host = U.$('#keybinds');
    U.clear(host);
    Object.keys(Input.labels).forEach(function (action) {
      var key = U.el('span', { class: 'kbd', text: Input.keyLabel(CONFIG.binds[action]) });
      key.addEventListener('click', function () {
        key.classList.add('listening');
        key.textContent = '키 입력…';
        Input.startListening(action, function () {
          key.classList.remove('listening');
          key.textContent = Input.keyLabel(CONFIG.binds[action]);
          buildKeybindUI();
        });
      });
      host.appendChild(U.el('div', { class: 'keybind-row' }, [
        U.el('span', { text: Input.labels[action] }), key
      ]));
    });
  }

  /* ------------------------------------------------------------- result */

  function wireResult() {
    U.$('#btn-result-menu').addEventListener('click', exitToMenu);
    U.$('#btn-result-again').addEventListener('click', function () {
      var r = Game.result();
      if (!r) { exitToMenu(); return; }
      if (r.kind === 'solo') Game.startSolo(r.mode);
      else if (r.kind === 'cpu') Game.startCpu(CONFIG.cpuLevel);
      else if (r.kind === 'versus') {
        if (r.ranked) {
          Game.leave();
          startRanked();
        } else {
          // The room is still alive; ready up and wait for the opponent.
          Game.setReady(true);
          showScreen('room');
          U.toast('상대가 다시 하기를 누르면 시작합니다.');
        }
      }
    });
  }

  /* --------------------------------------------------------------- exit */

  function requestExit() {
    if (current === 'game') {
      if (Game.isSpectating()) {
        showScreen('room');           // watching costs nothing to step away from
      } else if (Game.state().isOnline) {
        confirmForfeit();
      } else {
        exitToMenu();
      }
    } else if (current === 'queue') {
      cancelQueue();
    } else if (current === 'room') {
      Game.leave();
      showScreen('multi');
      loadRooms();
    } else if (current !== 'menu' && current !== 'boot') {
      showScreen('menu');
    }
  }

  /** Walking out of a live match hands the round to the opponent, so ask. */
  function confirmForfeit() {
    var playing = Game.state().phase === 'playing';
    var box = U.el('div', {}, [
      U.el('div', { class: 'panel-title', text: playing ? '경기를 기권할까요?' : '방에서 나갈까요?' }),
      U.el('p', {
        class: 'hint',
        text: playing
          ? '지금 나가면 남은 라운드는 상대의 승리로 처리됩니다.'
          : '방을 나가면 대기 중인 상대와의 연결이 끊어집니다.'
      }),
      U.el('div', { style: 'height:16px' })
    ]);
    var leaveBtn = U.el('button', { class: 'btn danger wide', text: '나가기' });
    leaveBtn.addEventListener('click', function () {
      U.closeModal();
      exitToMenu();
    });
    var stayBtn = U.el('button', { class: 'btn ghost wide', text: '계속하기', style: 'margin-top:8px' });
    stayBtn.addEventListener('click', U.closeModal);
    box.appendChild(leaveBtn);
    box.appendChild(stayBtn);
    U.modal(box);
  }

  function cancelQueue() {
    stopQueue();
    Net.queueLeave().catch(function () {});
    showScreen('menu');
  }

  function exitToMenu() {
    stopQueue();
    Game.leave();
    showScreen('menu');
    refreshProfile();
  }

  /* --------------------------------------------------------------- init */

  function init() {
    U.watchViewport();
    wireAuth();
    wireMenu();
    wireMulti();
    wireLeaderboard();
    wireConfig();
    wireResult();
    U.$('#btn-cancel-queue').addEventListener('click', cancelQueue);
    boot();
  }

  return {
    init: init,
    showScreen: showScreen,
    currentScreen: currentScreen,
    profile: function () { return profile; },
    updateProfile: updateProfile,
    refreshProfile: refreshProfile,
    renderRoom: renderRoom,
    onChat: onChat,
    requestExit: requestExit,
    exitToMenu: exitToMenu
  };
})();

(function bootOnce() {
  var started = false;
  function go() { if (started) return; started = true; App.init(); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', go);
  else go();
})();

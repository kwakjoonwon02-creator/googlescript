<script>
/* ================================================================ attack ==
   Damage table modelled on TETR.IO's: a small base value per clear type, a
   multiplicative combo bonus with a logarithmic floor so long combos keep
   paying, an escalating back-to-back bonus, and a flat perfect-clear bonus.

   Everything lives in ATTACK_TABLE so a room can retune the game in one
   place without touching the engine.
   ========================================================================= */

var ATTACK_TABLE = {
  base: {
    1: 0,   // single
    2: 1,   // double
    3: 2,   // triple
    4: 4    // quad
  },
  spinFull: {
    1: 2,   // t-spin single
    2: 4,   // t-spin double
    3: 6    // t-spin triple
  },
  spinMini: {
    1: 0,
    2: 1,
    3: 2
  },
  perfectClear: 10,
  comboMultiplier: 0.25,
  comboLogBase: 1.25,
  b2bBase: 1,
  b2bSurgeAt: 3,
  b2bSurgeScale: 0.8
};

var Attack = (function () {

  /**
   * @param {{lines:number, spin:?string, combo:number, b2b:number,
   *          perfect:boolean, multiplier:number}} ev
   *        combo and b2b are the engine's counters: -1 means "no chain",
   *        0 means "first of a chain".
   */
  function compute(ev) {
    var lines = ev.lines || 0;
    if (lines <= 0) return { attack: 0, label: null };

    var base;
    if (ev.spin === 'full') base = ATTACK_TABLE.spinFull[lines] || 0;
    else if (ev.spin === 'mini') base = ATTACK_TABLE.spinMini[lines] || 0;
    else base = ATTACK_TABLE.base[lines] || 0;

    // Back-to-back: b2b === 0 is the first difficult clear (no bonus yet),
    // 1 and up is an actual chain.
    var b2bChain = ev.b2b || 0;
    if (b2bChain > 0) {
      base += ATTACK_TABLE.b2bBase;
      if (b2bChain >= ATTACK_TABLE.b2bSurgeAt) {
        base += Math.floor(Math.log1p(b2bChain * ATTACK_TABLE.b2bSurgeScale));
      }
    }

    // Combo: combo === 0 is the first clear of the chain (no bonus).
    var combo = ev.combo || 0;
    if (combo > 0) {
      base = base * (1 + ATTACK_TABLE.comboMultiplier * combo);
      if (combo > 1) {
        base = Math.max(Math.log1p(combo * ATTACK_TABLE.comboLogBase), base);
      }
    }

    var attack = Math.floor(base);
    if (ev.perfect) attack += ATTACK_TABLE.perfectClear;
    attack = Math.floor(attack * (ev.multiplier === undefined ? 1 : ev.multiplier));

    return { attack: Math.max(0, attack), label: label(ev) };
  }

  var CLEAR_NAMES = { 1: 'SINGLE', 2: 'DOUBLE', 3: 'TRIPLE', 4: 'QUAD' };

  /** Human-readable name of the clear, used for the on-screen popups. */
  function label(ev) {
    if (!ev.lines) return null;
    if (ev.spin === 'full') return 'T-SPIN ' + (CLEAR_NAMES[ev.lines] || '');
    if (ev.spin === 'mini') return 'T-SPIN MINI ' + (CLEAR_NAMES[ev.lines] || '');
    return CLEAR_NAMES[ev.lines] || '';
  }

  /* Guideline scoring, used by Blitz and shown in solo modes. */
  var SCORE_BASE = { 1: 100, 2: 300, 3: 500, 4: 800 };
  var SCORE_SPIN_FULL = { 0: 400, 1: 800, 2: 1200, 3: 1600 };
  var SCORE_SPIN_MINI = { 0: 100, 1: 200, 2: 400, 3: 400 };

  function score(ev) {
    var level = ev.level || 1;
    var value = 0;
    if (ev.spin === 'full') value = SCORE_SPIN_FULL[ev.lines] || 0;
    else if (ev.spin === 'mini') value = SCORE_SPIN_MINI[ev.lines] || 0;
    else value = SCORE_BASE[ev.lines] || 0;

    if (ev.b2b > 0 && (ev.lines === 4 || ev.spin)) value = Math.floor(value * 1.5);
    value *= level;
    if (ev.combo > 0) value += 50 * ev.combo * level;
    if (ev.perfect) value += 3500 * level;
    return value;
  }

  /** Rough "how bad is my board" number, used by the CPU and the danger tint. */
  function pressure(pendingLines, stackHeight) {
    return (pendingLines * 1.5) + Math.max(0, stackHeight - 10) * 0.6;
  }

  return { compute: compute, label: label, score: score, pressure: pressure, table: ATTACK_TABLE };
})();
</script>
